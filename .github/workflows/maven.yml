# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: inventory-management cicd workflow

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7

      - name: Set up JDK 21
        uses: actions/setup-java@v4.2.2
        with:
          java-version: 21
          distribution: 'corretto'

      - name: Cache Maven packages
        uses: actions/cache@v3.3.1
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Build Project
        run: |
          mvn clean install -DskipTests
          mvn -B package --file pom.xml

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install postgresql-client-14
        env:
          POSTGRES_DB: ${{ vars.INVENTORY_DATABASE_POSTGRESQL }}
          POSTGRES_USER: ${{ vars.INVENTORY_DATABASE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.INVENTORY_DATABASE_PASSWORD }}

#      - name: Flyway Migration
#        uses: joshuaavalon/flyway-action@v3.0.0
#        with:
#          args: >-
#            docker run --rm -v ${{ github.workspace }}:/flyway/sql flyway/flyway:10 \
#            -workingDirectory="/github/workspace/" \
#            -url=${{ vars.INVENTORY_DATABASE_POSTGRESQL }} \
#            -user=${{ vars.INVENTORY_DATABASE_USERNAME }} \
#            -password=${{ secrets.INVENTORY_DATABASE_PASSWORD }}
#            migrate
#        env:
#          FLYWAY_VALIDATE_MIGRATION_NAMING: true

      - name: Checkout Test and Launch app with prod profile
        env:
          INVENTORY_KEYCLOAK_CLIENT_ID: ${{ vars.INVENTORY_KEYCLOAK_CLIENT_ID}}
          INVENTORY_KEYCLOAK_CLIENT_SECRET: ${{ secrets.INVENTORY_KEYCLOAK_CLIENT_SECRET }}
          INVENTORY_KEYCLOAK_SERVER_URL: ${{ vars.INVENTORY_KEYCLOAK_SERVER_URL }}
          CLOUDINARY_NAME: ${{ vars.CLOUDINARY_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          mvn -B verify --file pom.xml
          java -jar target/management-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod

      - name: Build Docker
        uses: docker/build-push-action@v3
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/inventory-management:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v2
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/inventory-management:latest


    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive

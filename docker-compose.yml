version: '3.8'

services:
  inventory-management:
    container_name: inventory_management
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: koko
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: inventory_management
      PGDATA: /data/postgres
    ports:
      - "5432:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    networks:
      - inventory-data
    restart: unless-stopped

  keycloak:
    container_name: inventory_keycloak
    image: quay.io/keycloak/keycloak:24.0.2
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: password123
      KEYCLOAK_REALM: master
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password123
    networks:
      - inventory-data
    volumes:
      - keycloak_data:/opt/keycloak/data
    command:
      - "start-dev"
    restart: unless-stopped   # Ajout de la politique de redémarrage

volumes:
  inventory_data:
  keycloak_data:

networks:
  inventory-data:
    driver: bridge
